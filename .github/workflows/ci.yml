name: CI

# Validation only — this workflow never deploys anything. Deployment
# (GitHub → CI → Vercel) is a separate milestone; see README.md.
on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only reads the repo, it never needs to
# write anything (no PR comments, no releases, no packages).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
